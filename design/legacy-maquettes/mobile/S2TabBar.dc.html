<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre d'onglets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navigation principale" style="width: 390px; height: 80px; box-sizing: border-box; border-top: 1px solid #E3DDD0; background: #FFFFFF; display: flex; justify-content: space-around; align-items: center; padding: 0 8px 8px; font-family: 'Nunito', system-ui, sans-serif;">
<sc-for list="{{items}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.click}}" aria-current="{{t.current}}" style="{{t.style}}">
<span style="{{t.pill}}">
<sc-if value="{{t.is.accueil}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></sc-if>
<sc-if value="{{t.is.plan}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></sc-if>
<sc-if value="{{t.is.liste}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11.2L21 8H6.5"></path><circle cx="9" cy="19.5" r="1.5"></circle><circle cx="17" cy="19.5" r="1.5"></circle></svg></sc-if>
<sc-if value="{{t.is.profil}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></sc-if>
</span>
{{t.label}}
</button>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["accueil","plan","liste","profil"],"default":"accueil"},"go":{"editor":null},"$preview":{"width":390,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var g = this.props.go, a = this.props.active || "accueil";
    var defs = [["accueil", "Accueil"], ["plan", "Plan"], ["liste", "Courses"], ["profil", "Profil"]];
    return { items: defs.map(function (d) {
      var on = d[0] === a;
      return {
        label: d[1], current: on ? "page" : "false",
        is: { accueil: d[0] === "accueil", plan: d[0] === "plan", liste: d[0] === "liste", profil: d[0] === "profil" },
        click: function () { if (g) g(d[0]); },
        style: "display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 56px; justify-content: center; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: " + (on ? 900 : 700) + "; color: " + (on ? "#4A2545" : "#625A60") + ";",
        pill: "display: flex; align-items: center; justify-content: center; width: 56px; height: 30px; border-radius: 15px; background: " + (on ? "#EFE3EC" : "transparent") + ";"
      };
    }) };
  }
}
</script>
</body>
</html>
