<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Paywall — essai Premium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; color: #2A1A28; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="height: 200px; flex-shrink: 0; background: #4A2545; position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 0 20px 20px;">
<svg width="390" height="200" viewBox="0 0 390 200" style="position: absolute; inset: 0;" aria-hidden="true"><circle cx="330" cy="40" r="90" fill="#5C3B58"></circle><circle cx="330" cy="40" r="54" fill="#6E516A"></circle><circle cx="40" cy="190" r="50" fill="#5C3B58"></circle></svg>
<div style="position: absolute; right: 24px; top: 34px; transform: rotate(-8deg);"><dc-import name="S2Plat" variant="soupe" size="96" hint-size="96px,96px"></dc-import></div>
<div style="position: absolute; right: 108px; top: 92px; transform: rotate(10deg);"><dc-import name="S2Plat" variant="pates" size="72" hint-size="72px,72px"></dc-import></div>
<button onClick="{{close}}" aria-label="Fermer" style="position: absolute; left: 16px; top: 16px; width: 44px; height: 44px; border-radius: 22px; border: none; background: #4A2545; display: flex; align-items: center; justify-content: center; color: #FFFFFF; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px; max-width: 230px;">
<span style="align-self: flex-start; font-size: 11px; font-weight: 900; color: #2A1A28; background: #EE7A30; padding: 4px 10px; border-radius: 10px; letter-spacing: 0.5px;">14 JOURS OFFERTS</span>
<h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 900; color: #FFFFFF; letter-spacing: -0.5px;">Passe en Premium</h1>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 22px;">
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #625A60; font-weight: 600;">Sans carte bancaire. Après 14 jours, tu repasses en gratuit automatiquement : ton plan reste à toi.</p>
<div style="display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{feats}}" as="f" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 12px; background: #EFE3EC; display: flex; align-items: center; justify-content: center; color: #4A2545;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span style="display: flex; flex-direction: column;">
<span style="font-size: 15px; font-weight: 900;">{{f.t}}</span>
<span style="font-size: 13px; color: #625A60; font-weight: 600;">{{f.d}}</span>
</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 10px;" role="radiogroup" aria-label="Formule">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
<button role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">
<sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -10px; left: 12px; font-size: 11px; font-weight: 900; color: #2A1A28; background: #EE7A30; padding: 2px 8px; border-radius: 8px;">{{p.badge}}</span></sc-if>
<span style="font-size: 14px; font-weight: 900;">{{p.name}}</span>
<span style="font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums;">{{p.price}}</span>
<span style="font-size: 12px; color: #625A60; font-weight: 700;">{{p.sub}}</span>
</button>
</sc-for>
</div>
<div style="flex-grow: 1;"></div>
<button onClick="{{close}}" style="height: 58px; border-radius: 29px; border: none; background: #4A2545; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 20px rgba(74, 37, 69, 0.28);">Commencer mes 14 jours gratuits</button>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #625A60; text-align: center;">Aucun prélèvement pendant l'essai. Ensuite {{after}}, seulement si tu t'abonnes. Résiliable à tout moment.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { plan: "annual" }; }
  renderVals() {
    var self = this, g = this.props.go;
    var feats = [
      { t: "Détail produit par produit", d: "Vois où chaque article coûte le moins cher" },
      { t: "Changer d'enseigne en un geste", d: "Ta liste se recalcule instantanément" },
      { t: "Plans illimités", d: "Varie tes menus autant que tu veux" },
      { t: "Alertes promos", d: "Sur les produits de ton plan" },
      { t: "Partage en famille", d: "Une liste commune pour tout le foyer" }
    ];
    var pd = [
      { id: "annual", name: "Annuel", price: "39,99 €", sub: "3,33 € / mois", badge: "−33 %", after: "39,99 € / an" },
      { id: "monthly", name: "Mensuel", price: "4,99 €", sub: "par mois", badge: "", after: "4,99 € / mois" }
    ];
    var after = "";
    var plans = pd.map(function (p) {
      var on = self.state.plan === p.id; if (on) after = p.after;
      return { name: p.name, price: p.price, sub: p.sub, badge: p.badge, on: on, pick: function () { self.setState({ plan: p.id }); },
        style: "flex: 1; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 14px 12px; border-radius: 18px; cursor: pointer; font-family: inherit; text-align: left; color: #2A1A28; background: #FFFFFF; border: 2px solid " + (on ? "#4A2545" : "#E3DDD0") + ";" + (on ? " box-shadow: 0 6px 16px rgba(74, 37, 69, 0.16);" : "") };
    });
    return { feats: feats, plans: plans, after: after, close: function () { if (g) g("accueil"); } };
  }
}
</script>
</body>
</html>
