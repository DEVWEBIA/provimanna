<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Liste de courses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; color: #2A1A28; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 12px; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 4px;">
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.5px;">Mes courses</h1>
<span style="font-size: 14px; color: #625A60; font-weight: 700;">Lidl · 38 articles · 62,40 €</span>
</div>
<button onClick="{{toScan}}" aria-label="Scanner mon ticket" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #E3DDD0; background: #FFFFFF; display: flex; align-items: center; gap: 6px; color: #2A1A28; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 800;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M8 9h8M8 12h8M8 15h5"></path></svg>Ticket</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 12px 14px;">
<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="#F1EEE8" stroke-width="6"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="#4A2545" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 24 24)"></circle></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<span style="font-size: 16px; font-weight: 900;">{{doneLabel}}</span>
<span style="font-size: 13px; color: #625A60; font-weight: 700;">Reste environ {{rest}}</span>
</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 2px 4px 0; font-size: 12px; font-weight: 900; color: #625A60; text-transform: uppercase; letter-spacing: 0.6px;">{{g.title}}</h2>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 0 12px;">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<label style="{{it.row}}">
<input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 22px; height: 22px; accent-color: #4A2545; margin: 0; flex-shrink: 0;">
<span style="{{it.nameStyle}}">{{it.name}}</span>
<span style="font-size: 13px; color: #625A60; font-weight: 600;">{{it.qty}}</span>
<span style="font-size: 14px; font-weight: 900; width: 52px; text-align: right; font-variant-numeric: tabular-nums;">{{it.price}}</span>
</label>
</sc-for>
</div>
</div>
</sc-for>
<div style="flex-grow: 1;"></div>
<button style="height: 56px; border-radius: 28px; border: none; background: #4A2545; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(74, 37, 69, 0.28);">Envoyer vers le drive Lidl
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
</button>
</div>
<dc-import name="S2TabBar" active="liste" go="{{go}}" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: { epinards: true, oignons: true, riz: true } }; }
  renderVals() {
    var self = this, g = this.props.go;
    var data = [
      { title: "Fruits & légumes", items: [["oignons", "Oignons", "x4", 0.80], ["epinards", "Épinards", "400 g", 2.29], ["potimarron", "Potimarron", "1 pièce", 2.20]] },
      { title: "Épicerie", items: [["pois", "Pois chiches", "x4", 2.52], ["coco", "Lait de coco", "x2", 2.18], ["riz", "Riz basmati", "1 kg", 1.89]] },
      { title: "Frais", items: [["yaourt", "Yaourts nature", "x8", 1.45], ["feta", "Feta", "200 g", 1.99]] }
    ];
    function eur(n) { return n.toFixed(2).replace(".", ",") + " €"; }
    var total = 0, done = 0, rest = 0;
    var groups = data.map(function (gr) {
      return { title: gr.title, items: gr.items.map(function (it, i) {
        var d = !!self.state.done[it[0]]; total++; if (d) done++; else rest += it[3];
        return { name: it[1], qty: it[2], price: eur(it[3]), done: d,
          toggle: function () { var n = Object.assign({}, self.state.done); n[it[0]] = !d; self.setState({ done: n }); },
          row: "display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer;" + (i < gr.items.length - 1 ? " border-bottom: 1px solid #F1EEE8;" : ""),
          nameStyle: "flex-grow: 1; font-size: 15px; font-weight: 800;" + (d ? " text-decoration: line-through; color: #918C90;" : "") };
      }) };
    });
    var c = 2 * Math.PI * 20, f = done / total;
    return { go: g, groups: groups, doneLabel: done + " sur " + total + " dans le panier", rest: eur(rest), dash: (c * f).toFixed(1) + " " + c.toFixed(1), toScan: function () { if (g) g("scan"); } };
  }
}
</script>
</body>
</html>
