<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plan de la semaine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; color: #2A1A28; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 12px; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 4px;">
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.5px;">Ma semaine</h1>
<span style="font-size: 14px; color: #625A60; font-weight: 700;">9 – 15 nov. · 14 repas · 38 produits</span>
</div>
<button aria-label="Régénérer le plan" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #E3DDD0; background: #FFFFFF; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #2A1A28; font-family: inherit; font-size: 14px; font-weight: 800;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"></path><path d="M4 3v5h5"></path><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"></path><path d="M20 21v-5h-5"></path></svg>Varier</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="{{d.style}}">
<span style="font-size: 12px; font-weight: 800;">{{d.label}}</span>
<span style="font-size: 18px; font-weight: 900;">{{d.num}}</span>
<span style="{{d.dot}}"></span>
</button>
</sc-for>
</div>
<sc-for list="{{meals}}" as="m" hint-placeholder-count="2">
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 24px; padding: 12px; display: flex; gap: 12px; align-items: center;">
<button onClick="{{toRecette}}" aria-label="{{m.open}}" style="border: none; background: #F6F3EC; border-radius: 20px; padding: 6px; cursor: pointer; display: flex;">
<dc-import name="S2Plat" variant="{{m.variant}}" size="88" hint-size="88px,88px"></dc-import>
</button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
<span style="font-size: 11px; font-weight: 900; color: #625A60; text-transform: uppercase; letter-spacing: 0.6px;">{{m.when}}</span>
<span style="font-size: 17px; font-weight: 900; line-height: 1.2;">{{m.name}}</span>
<span style="font-size: 13px; color: #625A60; font-weight: 600;">{{m.meta}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
<span style="font-size: 15px; font-weight: 900; color: #4A2545;">{{m.price}} <span style="font-size: 12px; color: #625A60; font-weight: 700;">/ part</span></span>
<button aria-label="{{m.swap}}" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #E3DDD0; background: #F6F3EC; color: #2A1A28; cursor: pointer; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4"></path><path d="M3 8h14"></path><path d="M17 20l4-4-4-4"></path><path d="M21 16H7"></path></svg>
</button>
</div>
</div>
</div>
</sc-for>
<button style="min-height: 52px; border-radius: 20px; border: 2px dashed #E3DDD0; background: transparent; color: #625A60; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;">+ Ajouter un goûter</button>
<div style="flex-grow: 1;"></div>
<div style="background: #2A1A28; color: #FFFFFF; border-radius: 22px; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 26px rgba(42, 26, 40, 0.25);">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 800; color: #D0CDD0;">Chez Auchan · 74,20 €</span>
<span style="font-size: 15px; font-weight: 900; color: #EE7A30;">−11,80 € possible chez Lidl</span>
</div>
<button onClick="{{toComp}}" style="min-height: 46px; padding: 0 18px; border-radius: 23px; border: none; background: #EE7A30; color: #2A1A28; font-family: inherit; font-size: 15px; font-weight: 900; cursor: pointer;">Comparer</button>
</div>
</div>
<dc-import name="S2TabBar" active="plan" go="{{go}}" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { day: 1 }; }
  renderVals() {
    var self = this, g = this.props.go;
    function nav(s) { return function () { if (g) g(s); }; }
    var labels = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
    var days = labels.map(function (l, i) {
      var on = self.state.day === i;
      return { label: l, num: String(9 + i), on: on, pick: function () { self.setState({ day: i }); },
        style: "min-height: 66px; border-radius: 18px; border: 1px solid " + (on ? "#4A2545" : "#E3DDD0") + "; background: " + (on ? "#4A2545" : "#FFFFFF") + "; color: " + (on ? "#FFFFFF" : "#2A1A28") + "; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: inherit; cursor: pointer; padding: 0;",
        dot: "width: 5px; height: 5px; border-radius: 3px; background: " + (i < 1 ? (on ? "#FFFFFF" : "#A9A4A8") : (on ? "#EE7A30" : "#EE7A30")) + ";" };
    });
    var menus = [
      [["Midi", "pates", "Pâtes à la tomate & basilic", "15 min · 4 parts", "0,98 €"], ["Soir", "soupe", "Velouté de potimarron", "30 min · 4 parts · de saison", "1,12 €"]],
      [["Midi", "salade", "Salade de lentilles & feta", "20 min · 4 parts", "1,40 €"], ["Soir", "curry", "Curry de pois chiches", "35 min · 4 parts · végé", "1,85 €"]],
      [["Midi", "soupe", "Velouté de potimarron", "30 min · 4 parts · de saison", "1,12 €"], ["Soir", "pates", "Pâtes à la tomate & basilic", "15 min · 4 parts", "0,98 €"]],
      [["Midi", "curry", "Curry de pois chiches", "35 min · 4 parts · végé", "1,85 €"], ["Soir", "salade", "Salade de lentilles & feta", "20 min · 4 parts", "1,40 €"]]
    ];
    var meals = menus[self.state.day % 4].map(function (m) {
      return { when: m[0], variant: m[1], name: m[2], meta: m[3], price: m[4], open: "Ouvrir la recette : " + m[2], swap: "Remplacer : " + m[2] };
    });
    return { go: g, days: days, meals: meals, toRecette: nav("recette"), toComp: nav("comparateur") };
  }
}
</script>
</body>
</html>
