<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Détail produit par produit — Premium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; color: #2A1A28; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 16px 20px; gap: 12px; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 10px;">
<button onClick="{{back}}" aria-label="Retour au comparateur" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E3DDD0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2A1A28; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 21px; font-weight: 900;">Lidl ou Auchan&nbsp;?</h1>
<span style="font-size: 13px; color: #625A60; font-weight: 700;">Produit par produit</span>
</div>
<span style="font-size: 11px; font-weight: 900; color: #2A1A28; background: #EE7A30; padding: 5px 10px; border-radius: 10px;">PREMIUM</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="background: #FFFFFF; border: 2px solid #EE7A30; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 800; color: #625A60;">Lidl moins cher sur</span>
<span style="font-size: 26px; font-weight: 900;">29 <span style="font-size: 14px; color: #625A60;">/ 38</span></span>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 800; color: #625A60;">Auchan moins cher sur</span>
<span style="font-size: 26px; font-weight: 900;">9 <span style="font-size: 14px; color: #625A60;">/ 38</span></span>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 20px; overflow: hidden;">
<div style="display: flex; align-items: center; padding: 10px 14px; background: #F1EEE8; font-size: 12px; font-weight: 900; color: #625A60; text-transform: uppercase; letter-spacing: 0.5px;">
<span style="flex-grow: 1;">Produit</span><span style="width: 64px; text-align: right;">Lidl</span><span style="width: 70px; text-align: right;">Auchan</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="{{r.row}}">
<span style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
<span style="font-size: 14px; font-weight: 800;">{{r.name}}</span>
<span style="font-size: 12px; color: #625A60; font-weight: 600;">{{r.qty}}</span>
</span>
<span style="{{r.a}}">{{r.pa}}</span>
<span style="{{r.b}}">{{r.pb}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; background: #FCE3D3; border-radius: 14px; padding: 10px 12px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A420E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
<span style="font-size: 13px; line-height: 1.4; color: #9A420E; font-weight: 700;">Pâte de curry indisponible chez Lidl : remplacée par un équivalent (1,59 €).</span>
</div>
<div style="flex-grow: 1;"></div>
<button onClick="{{toListe}}" style="height: 58px; border-radius: 29px; border: none; background: #4A2545; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 20px rgba(74, 37, 69, 0.28);">Faire mes courses chez Lidl · 62,40 €</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var g = this.props.go;
    function nav(s) { return function () { if (g) g(s); }; }
    var d = [["Pois chiches", "x4 boîtes", 2.52, 3.16], ["Lait de coco", "x2 · 40 cl", 2.18, 2.58], ["Riz basmati", "1 kg", 1.89, 2.39], ["Épinards", "400 g", 2.29, 2.56], ["Yaourts nature", "x8", 1.45, 1.89], ["Feta", "200 g", 1.99, 2.15], ["Tomates", "1 kg", 2.59, 2.49], ["Potimarron", "1 pièce", 2.20, 1.95]];
    function eur(n) { return n.toFixed(2).replace(".", ",") + " €"; }
    function cell(w, win) { return "width: " + w + "px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; font-weight: " + (win ? 900 : 600) + "; color: " + (win ? "#2A1A28" : "#625A60") + ";" + (win ? " text-decoration: underline; text-decoration-color: #EE7A30; text-decoration-thickness: 3px; text-underline-offset: 4px;" : ""); }
    var rows = d.map(function (r, i) {
      var aw = r[2] <= r[3];
      return { name: r[0], qty: r[1], pa: eur(r[2]), pb: eur(r[3]), a: cell(64, aw), b: cell(70, !aw),
        row: "display: flex; align-items: center; padding: 7px 14px; min-height: 40px;" + (i < d.length - 1 ? " border-bottom: 1px solid #F1EEE8;" : "") };
    });
    return { rows: rows, back: nav("comparateur"), toListe: nav("liste") };
  }
}
</script>
</body>
</html>
