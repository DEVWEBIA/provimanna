<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Profil et réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; color: #2A1A28; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 12px; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 14px; padding: 0 4px;">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #4A2545; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></span>
<div style="display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 22px; font-weight: 900;">Mon foyer</h1>
<span style="font-size: 14px; color: #625A60; font-weight: 700;">2 adultes · 2 enfants · Auchan</span>
</div>
</div>
<div style="background: #2A1A28; color: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<span style="font-size: 15px; font-weight: 900;">Essai Premium</span>
<span style="font-size: 12px; font-weight: 900; color: #2A1A28; background: #EE7A30; padding: 3px 10px; border-radius: 10px;">9 jours restants</span>
</div>
<div style="height: 8px; border-radius: 4px; background: #50434F; overflow: hidden;"><span style="display: block; width: 36%; height: 8px; border-radius: 4px; background: #EE7A30;"></span></div>
<span style="font-size: 13px; color: #D0CDD0; font-weight: 600;">Sans carte enregistrée. Le 19 nov., tu repasses en gratuit si tu ne fais rien.</span>
<button onClick="{{toPaywall}}" style="align-self: flex-start; min-height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: #FFFFFF; color: #2A1A28; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer;">Voir les formules</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="background: #FCE3D3; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 800; color: #9A420E;">Économisé depuis le début</span>
<span style="font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums;">58,30 €</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 800; color: #625A60;">Plans générés</span>
<span style="font-size: 24px; font-weight: 900;">6</span>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 20px; padding: 0 14px;">
<sc-for list="{{settings}}" as="s" hint-placeholder-count="6">
<button style="{{s.row}}">
<span style="flex-grow: 1; font-size: 15px; font-weight: 800; text-align: left;">{{s.label}}</span>
<span style="font-size: 14px; color: #625A60; font-weight: 700;">{{s.value}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#918C90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
<button style="min-height: 44px; border: none; background: none; color: #4A2545; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;">Se déconnecter</button>
</div>
<dc-import name="S2TabBar" active="profil" go="{{go}}" hint-size="390px,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var g = this.props.go;
    var d = [["Taille du foyer", "4 personnes"], ["Enseigne préférée", "Auchan"], ["Régime", "Flexitarien"], ["Pays et devise", "France · €"], ["Notifications", "Promos, plan"], ["Confidentialité", ""]];
    var settings = d.map(function (s, i) {
      return { label: s[0], value: s[1], row: "display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; border: none; background: transparent; padding: 0; cursor: pointer; font-family: inherit; color: #2A1A28;" + (i < d.length - 1 ? " border-bottom: 1px solid #F1EEE8;" : "") };
    });
    return { go: g, settings: settings, toPaywall: function () { if (g) g("paywall"); } };
  }
}
</script>
</body>
</html>
