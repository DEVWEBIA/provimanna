<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Illustration de plat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center;">
<sc-if value="{{is.curry}}" hint-placeholder-val="{{true}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="Curry de pois chiches">
<circle cx="60" cy="60" r="57" fill="#FFFFFF"></circle><circle cx="60" cy="60" r="57" fill="none" stroke="#E3DDD0" stroke-width="2"></circle>
<circle cx="60" cy="60" r="45" fill="#F7EEE8"></circle>
<path d="M22 66c0-20 17-33 38-33s38 13 38 33c0 15-17 25-38 25S22 81 22 66z" fill="#E9A23B"></path>
<path d="M30 70c8 6 20 9 30 9s22-3 30-9" stroke="#D2862A" stroke-width="3" fill="none" stroke-linecap="round"></path>
<ellipse cx="44" cy="52" rx="19" ry="12" fill="#FFFCF4"></ellipse>
<circle cx="40" cy="50" r="1.6" fill="#E9DFC9"></circle><circle cx="49" cy="53" r="1.6" fill="#E9DFC9"></circle><circle cx="45" cy="47" r="1.6" fill="#E9DFC9"></circle>
<circle cx="68" cy="58" r="5" fill="#F6D58E" stroke="#C9893A" stroke-width="1.2"></circle><circle cx="80" cy="66" r="5" fill="#F6D58E" stroke="#C9893A" stroke-width="1.2"></circle><circle cx="62" cy="72" r="5" fill="#F6D58E" stroke="#C9893A" stroke-width="1.2"></circle><circle cx="74" cy="78" r="5" fill="#F6D58E" stroke="#C9893A" stroke-width="1.2"></circle><circle cx="86" cy="55" r="5" fill="#F6D58E" stroke="#C9893A" stroke-width="1.2"></circle>
<path d="M36 76c6-9 17-9 22 0-6 7-15 7-22 0z" fill="#4E7A2B"></path><path d="M78 44c4-8 14-9 19-2-5 7-13 8-19 2z" fill="#5E8F33"></path>
<circle cx="56" cy="62" r="1.5" fill="#4A2545"></circle><circle cx="90" cy="72" r="1.5" fill="#4A2545"></circle>
</svg>
</sc-if>
<sc-if value="{{is.salade}}" hint-placeholder-val="{{false}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="Salade de lentilles et feta">
<circle cx="60" cy="60" r="57" fill="#FFFFFF"></circle><circle cx="60" cy="60" r="57" fill="none" stroke="#E3DDD0" stroke-width="2"></circle>
<path d="M26 58c4-20 22-32 40-28 20 4 30 20 28 36-3 18-22 28-40 25-18-3-31-16-28-33z" fill="#7DB043"></path>
<path d="M34 48c10-4 18 2 20 10-10 3-18-2-20-10z" fill="#5E8F2E"></path><path d="M72 82c6-8 16-6 20 0-6 6-14 6-20 0z" fill="#5E8F2E"></path>
<circle cx="50" cy="62" r="3" fill="#6B4A2E"></circle><circle cx="57" cy="70" r="3" fill="#6B4A2E"></circle><circle cx="64" cy="60" r="3" fill="#6B4A2E"></circle><circle cx="46" cy="72" r="3" fill="#6B4A2E"></circle><circle cx="70" cy="70" r="3" fill="#6B4A2E"></circle><circle cx="60" cy="52" r="3" fill="#6B4A2E"></circle><circle cx="54" cy="80" r="3" fill="#6B4A2E"></circle>
<rect x="72" y="46" width="11" height="11" rx="2" fill="#FFFDF7" stroke="#EADFD3"></rect><rect x="38" y="80" width="10" height="10" rx="2" fill="#FFFDF7" stroke="#EADFD3"></rect><rect x="80" y="62" width="9" height="9" rx="2" fill="#FFFDF7" stroke="#EADFD3"></rect>
<circle cx="42" cy="44" r="7" fill="#E4572E"></circle><circle cx="42" cy="44" r="3.5" fill="#F28B6B"></circle><circle cx="86" cy="80" r="6" fill="#E4572E"></circle><circle cx="86" cy="80" r="3" fill="#F28B6B"></circle>
</svg>
</sc-if>
<sc-if value="{{is.soupe}}" hint-placeholder-val="{{false}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="Velouté de potimarron">
<circle cx="60" cy="60" r="57" fill="#FFFFFF"></circle><circle cx="60" cy="60" r="57" fill="none" stroke="#E3DDD0" stroke-width="2"></circle>
<circle cx="60" cy="60" r="44" fill="#E98A2E"></circle><circle cx="60" cy="60" r="44" fill="none" stroke="#D27420" stroke-width="3"></circle>
<path d="M44 56c6-10 22-10 28 0 4 8-6 16-14 12" stroke="#FFF3E3" stroke-width="4" fill="none" stroke-linecap="round"></path>
<rect x="74" y="70" width="9" height="9" rx="2" fill="#F0C982" transform="rotate(12 78 74)"></rect><rect x="40" y="72" width="9" height="9" rx="2" fill="#F0C982" transform="rotate(-10 44 76)"></rect>
<circle cx="66" cy="44" r="2" fill="#3F5A1E"></circle><circle cx="72" cy="48" r="2" fill="#3F5A1E"></circle><circle cx="52" cy="80" r="2" fill="#3F5A1E"></circle><circle cx="80" cy="58" r="2" fill="#3F5A1E"></circle>
</svg>
</sc-if>
<sc-if value="{{is.pates}}" hint-placeholder-val="{{false}}">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="Pâtes à la tomate">
<circle cx="60" cy="60" r="57" fill="#FFFFFF"></circle><circle cx="60" cy="60" r="57" fill="none" stroke="#E3DDD0" stroke-width="2"></circle>
<circle cx="60" cy="60" r="40" fill="#F4CF6A"></circle>
<path d="M30 52c10-8 20 8 30 0s20 8 30 0M28 66c10-8 20 8 30 0s20 8 32 0M34 80c8-6 18 6 26 0s18 6 26 0M40 40c8-6 16 6 22 0s16 6 22 0" stroke="#E5B54A" stroke-width="4" fill="none" stroke-linecap="round"></path>
<circle cx="60" cy="60" r="20" fill="#C8382B"></circle><circle cx="54" cy="56" r="4" fill="#A72A20"></circle><circle cx="66" cy="64" r="3" fill="#A72A20"></circle>
<path d="M62 46c5-6 13-5 15 1-6 4-12 4-15-1z" fill="#3E7A2B"></path><path d="M48 66c3-6 10-7 13-2-4 5-10 6-13 2z" fill="#3E7A2B"></path>
<circle cx="70" cy="56" r="1.8" fill="#FFF6D8"></circle><circle cx="52" cy="62" r="1.8" fill="#FFF6D8"></circle><circle cx="60" cy="70" r="1.8" fill="#FFF6D8"></circle>
</svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["curry","salade","soupe","pates"],"default":"curry"},"size":{"editor":"int","default":160,"min":32,"max":400},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant || "curry";
    var s = Number(this.props.size) || 160;
    return { size: s, px: s + "px", is: { curry: v === "curry", salade: v === "salade", soupe: v === "soupe", pates: v === "pates" } };
  }
}
</script>
</body>
</html>
