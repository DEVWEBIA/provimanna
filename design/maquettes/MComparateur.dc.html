<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — comparateur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:'Bricolage Grotesque','Nunito',sans-serif}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; font-family: 'Nunito', sans-serif; color: #2A1A28;">
<div aria-hidden="true" style="padding: 22px 18px;"><p class="disp" style="margin: 0; font-size: 32px; font-weight: 800;">Semaine 47</p><div style="margin-top: 16px; display: flex; gap: 6px;"><span style="width: 52px; height: 62px; border-radius: 16px; background: #FFFFFF;"></span><span style="width: 52px; height: 62px; border-radius: 16px; background: #FFFFFF;"></span><span style="width: 52px; height: 62px; border-radius: 16px; background: #4A2545;"></span><span style="width: 52px; height: 62px; border-radius: 16px; background: #FFFFFF;"></span></div><div style="margin-top: 18px; height: 160px; border-radius: 24px; background: #FFFFFF;"></div></div>
<div style="position: absolute; inset: 0; background: rgba(42,26,40,0.5);"></div>

<section role="dialog" aria-label="Comparer les enseignes" style="position: absolute; left: 0; right: 0; bottom: 0; height: 740px; background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 10px 18px 24px; box-sizing: border-box; display: flex; flex-direction: column;">
<span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 9px; background: #E3DDD0;"></span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;"><h1 class="disp" style="margin: 0; font-size: 26px; font-weight: 800;">Ce plan coûte…</h1><a href="MPlan.dc.html" aria-label="Fermer" style="width: 40px; height: 40px; border-radius: 99px; background: #F6F3EC; display: grid; place-items: center; text-decoration: none; color: #2A1A28; font-weight: 900; font-size: 20px;">×</a></div>
<p style="margin: 2px 0 12px; font-size: 13px; font-weight: 700; color: #625A60;">14 repas · prix relevés il y a 3 jours en moyenne</p>
<div role="radiogroup" aria-label="Enseigne" style="display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{stores}}" as="s" hint-placeholder-count="6">
<button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">
<span style="width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 900; background: {{s.bg}};">{{s.k}}</span>
<span style="flex: 1; min-width: 0; text-align: left;"><span style="display: flex; justify-content: space-between; font-weight: 900; font-size: 15px;"><span>{{s.n}}</span><span class="num">{{s.t}}</span></span><span style="display: block; height: 6px; margin-top: 6px; border-radius: 9px; background: #F1ECE2;"><span style="display: block; height: 6px; border-radius: 9px; width: {{s.w}}; background: {{s.bar}};"></span></span></span>
</button>
</sc-for>
</div>
<div style="margin-top: 12px; background: {{dBg}}; border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 13px; font-weight: 900; color: {{dInk}};">{{dLabel}}</span><span class="disp num" style="font-size: 26px; font-weight: 800;">{{delta}}</span></div>
<a href="MListe.dc.html" style="margin-top: auto; min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #4A2545; color: #FFFFFF; font-weight: 900; text-decoration: none;">{{cta}}</a>
<p style="margin: 10px 0 0; text-align: center; font-size: 13px; font-weight: 700; color: #625A60;">Ton choix reste libre, même plus cher. <a href="MPaywall.dc.html" style="font-weight: 900;">Détail produit par produit</a></p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: 'Lidl' }; }
  renderVals() {
    var self = this, st = this.state;
    var fmt = function (v) { return v.toFixed(2).replace('.', ',') + ' €'; };
    var S = [['LI', 'Lidl', 60.1, '#E3ECF6'], ['AL', 'Aldi', 61.4, '#E7EFE2'], ['EL', 'E.Leclerc', 64.2, '#ECE6F5'], ['IN', 'Intermarché', 68.9, '#F5E9DC'], ['CA', 'Carrefour', 70.3, '#E2EFEF'], ['AU', 'Auchan · ton enseigne', 71.6, '#F4E3E6']];
    var stores = S.map(function (x, i) {
      var on = st.s === x[1];
      return { k: x[0], n: x[1], t: fmt(x[2]), bg: x[3], w: Math.round(x[2] / 71.6 * 100) + '%', bar: i === 0 ? '#EE7A30' : (i === 5 ? '#4A2545' : '#D9CFDA'), on: on ? 'true' : 'false', pick: function () { self.setState({ s: x[1] }); },
        style: 'display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border-radius:16px;background:#FFFFFF;cursor:pointer;font-family:Nunito;color:#2A1A28;' + (on ? 'border:2px solid #4A2545;box-shadow:0 0 0 3px #EFE3EC' : 'border:2px solid #EFEAE0') };
    });
    var cur = S.filter(function (x) { return x[1] === st.s; })[0], mine = cur[0] === 'AU';
    return { stores: stores, delta: mine ? fmt(71.6) : '−' + fmt(71.6 - cur[2]), dLabel: mine ? 'Total chez ton enseigne' : 'Économie vs Auchan',
      dBg: mine ? '#F6F3EC' : '#FCE3D3', dInk: mine ? '#625A60' : '#9A420E', cta: mine ? 'Garder Auchan' : 'Faire mes courses chez ' + cur[1] };
  }
}
</script>
</body>
</html>
