<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — famille et parrainage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:'Bricolage Grotesque','Nunito',sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; font-family: 'Nunito', sans-serif; color: #2A1A28;">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; padding: 18px 18px 28px; box-sizing: border-box;">
<header style="display: flex; align-items: center; gap: 12px;"><a href="MProfil.dc.html" aria-label="Retour au profil" style="width: 44px; height: 44px; border-radius: 99px; background: #FFFFFF; display: grid; place-items: center; text-decoration: none; color: #2A1A28; font-weight: 900; font-size: 20px;">‹</a><h1 class="disp" style="margin: 0; font-size: 26px; font-weight: 800;">Famille</h1></header>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 22px; color: #625A60;">Tout le foyer voit le plan et coche la liste en direct.</p>

<ul style="list-style: none; margin: 14px 0 0; padding: 0; background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 22px; overflow: hidden;">
<sc-for list="{{members}}" as="m" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #EFEAE0;"><span style="width: 42px; height: 42px; border-radius: 99px; display: grid; place-items: center; font-weight: 900; font-size: 14px; {{m.av}}">{{m.ini}}</span><span style="flex: 1; min-width: 0;"><span style="display: block; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{m.n}}</span><span style="font-size: 12px; color: #625A60; font-weight: 700;">{{m.sub}}</span></span><span style="{{m.tagStyle}}">{{m.tag}}</span></li>
</sc-for>
</ul>

<div style="margin-top: 12px; display: flex; gap: 8px;">
<label for="mfe" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Email à inviter</label>
<input id="mfe" type="email" value="{{email}}" onInput="{{onEmail}}" placeholder="prenom@email.fr" style="flex: 1; min-width: 0; min-height: 50px; border-radius: 14px; border: 2px solid #E3DDD0; padding: 0 14px; font: 700 15px Nunito; color: #2A1A28; background: #FFFFFF;">
<button type="button" onClick="{{invite}}" style="min-height: 50px; padding: 0 16px; border-radius: 14px; border: 0; background: #4A2545; color: #FFFFFF; font: 900 14px Nunito; cursor: pointer;">Inviter</button>
</div>

<section style="margin-top: 20px; background: #4A2545; color: #FFFFFF; border-radius: 24px; padding: 18px;">
<p style="margin: 0; font-size: 11px; font-weight: 900; letter-spacing: 1px; color: #E3CDE0;">PARRAINAGE</p>
<p class="disp" style="margin: 6px 0 0; font-size: 22px; line-height: 1.1; font-weight: 800;">1 mois offert pour toi et pour chaque ami abonné.</p>
<button type="button" onClick="{{copy}}" style="margin-top: 14px; width: 100%; min-height: 50px; border-radius: 14px; border: 0; background: #EE7A30; color: #2A1A28; font: 900 15px Nunito; cursor: pointer;">{{copyLabel}}</button>
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700;">
<p style="margin: 0; display: flex; justify-content: space-between;"><span>Sophie B.</span><span style="color: #B7DDB0;">abonnée · +1 mois</span></p>
<p style="margin: 0; display: flex; justify-content: space-between;"><span>Karim N.</span><span style="color: #E3CDE0;">en essai</span></p>
</div>
</section>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="MTabBar" active="prof" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { email: '', pending: ['thomas@exemple.fr'], copied: false }; }
  renderVals() {
    var self = this, s = this.state;
    var tag = 'font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;';
    var members = [{ ini: 'MD', n: 'Marion (toi)', sub: 'Gère l’abonnement', tag: 'Responsable', av: 'background:#4A2545;color:#FFFFFF', tagStyle: tag + 'background:#EFE3EC;color:#4A2545' }, { ini: 'LD', n: 'Léa', sub: '6 articles cochés', tag: 'Modifie', av: 'background:#EE7A30;color:#2A1A28', tagStyle: tag + 'background:#F6F3EC;color:#625A60' }]
      .concat(s.pending.map(function (e) { return { ini: e.charAt(0).toUpperCase(), n: e, sub: 'Invitation envoyée', tag: 'En attente', av: 'background:#F1ECE2;color:#8A8088;border:2px dashed #CFC5CD;box-sizing:border-box', tagStyle: tag + 'background:#F6E7C8;color:#6B4A0E' }; }));
    return { members: members, email: s.email, copyLabel: s.copied ? 'Lien copié ✓' : 'Copier mon lien de parrainage',
      onEmail: function (e) { self.setState({ email: e.target.value }); },
      invite: function () { if (/.+@.+\..+/.test(s.email)) self.setState({ pending: s.pending.concat([s.email]), email: '' }); },
      copy: function () { self.setState({ copied: true }); } };
  }
}
</script>
</body>
</html>
