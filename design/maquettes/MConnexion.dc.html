<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:'Bricolage Grotesque','Nunito',sans-serif}
.soc{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:999px;border:2px solid #E3DDD0;background:#FFFFFF;font:800 16px Nunito;color:#2A1A28;cursor:pointer;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; font-family: 'Nunito', sans-serif; color: #2A1A28;">
<div style="background: #4A2545; color: #FFFFFF; padding: 18px 20px 26px; border-radius: 0 0 32px 32px;">
<a href="MSite.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: #FFFFFF; font-weight: 900; text-decoration: none;"><svg width="26" height="26" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="3" width="24" height="28" rx="5" fill="#EE7A30"></rect><path d="M10 11h14M10 16h10M10 21h7" stroke="#2A1A28" stroke-width="2.4" stroke-linecap="round"></path></svg>[Nom de l'appli]</a>
<div style="display: flex; gap: 4px; margin-top: 18px;" aria-hidden="true"><dc-import variant="soupe" size="64" name="Plat" hint-size="64px,64px"></dc-import><dc-import variant="curry" size="64" name="Plat" hint-size="64px,64px"></dc-import><dc-import variant="tarte" size="64" name="Plat" hint-size="64px,64px"></dc-import></div>
<h1 class="disp" style="margin: 16px 0 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -1px;">{{heading}}</h1>
</div>

<div style="padding: 24px 20px;">
<sc-if value="{{isForm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px;">
<button type="button" class="soc"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#2A1A28" stroke-width="2"></circle><path d="M12 12h6" stroke="#2A1A28" stroke-width="2.4" stroke-linecap="round"></path></svg>Continuer avec Google</button>
<button type="button" class="soc"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#2A1A28" stroke-width="2"></rect></svg>Continuer avec Apple</button>
</div>
<p style="margin: 18px 0; display: flex; align-items: center; gap: 12px; color: #625A60; font-size: 13px; font-weight: 800;"><span style="flex: 1; height: 1px; background: #E3DDD0;"></span>ou par email<span style="flex: 1; height: 1px; background: #E3DDD0;"></span></p>
<label for="mce" style="display: block; font-weight: 900; font-size: 14px; margin-bottom: 6px;">Adresse email</label>
<input id="mce" type="email" value="{{email}}" onInput="{{onEmail}}" placeholder="ton@email.fr" style="width: 100%; box-sizing: border-box; min-height: 56px; border-radius: 16px; border: 2px solid {{border}}; padding: 0 16px; font: 700 17px Nunito; color: #2A1A28; background: #FFFFFF;">
<sc-if value="{{err}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 6px 0 0; font-size: 13px; font-weight: 800; color: #B42318;">Il manque le @ ou le domaine.</p></sc-if>
<button type="button" onClick="{{submit}}" style="margin-top: 14px; width: 100%; min-height: 58px; border-radius: 999px; border: 0; background: #4A2545; color: #FFFFFF; font: 900 17px Nunito; cursor: pointer;">Recevoir mon lien</button>
<p style="margin: 12px 0 0; text-align: center; font-size: 13px; color: #625A60;">Pas de mot de passe. Pas encore de compte ? Il sera créé.</p>
</sc-if>
<sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #FCE3D3; display: grid; place-items: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#9A420E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m4 7 8 6 8-6"></path></svg></div>
<p style="margin: 16px 0 0; font-size: 17px; line-height: 26px;">Lien envoyé à <strong>{{shown}}</strong>. Il est valable 15 minutes.</p>
<label for="code" style="display: block; margin-top: 18px; font-weight: 900; font-size: 14px;">Ou saisis le code reçu</label>
<input id="code" inputmode="numeric" placeholder="000 000" style="margin-top: 6px; width: 100%; box-sizing: border-box; min-height: 60px; border-radius: 16px; border: 2px solid #E3DDD0; padding: 0 16px; font: 900 26px Nunito; letter-spacing: 8px; text-align: center; color: #2A1A28; background: #FFFFFF;">
<a href="MOnboarding.dc.html" style="margin-top: 14px; min-height: 58px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #4A2545; color: #FFFFFF; font-weight: 900; font-size: 17px; text-decoration: none;">Valider</a>
<button type="button" onClick="{{back}}" style="margin-top: 8px; width: 100%; min-height: 48px; border: 0; background: transparent; font: 800 15px Nunito; color: #4A2545; cursor: pointer;">Changer d'adresse</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sent: false, email: '', tried: false }; }
  renderVals() {
    var self = this, s = this.state, ok = /.+@.+\..+/.test(s.email);
    return { isForm: !s.sent, isSent: s.sent, heading: s.sent ? 'Regarde tes emails.' : 'Content de te voir.', email: s.email, shown: s.email || 'ton@email.fr',
      err: s.tried && !ok, border: s.tried && !ok ? '#B42318' : '#E3DDD0',
      onEmail: function (e) { self.setState({ email: e.target.value }); },
      submit: function () { if (ok) self.setState({ sent: true, tried: false }); else self.setState({ tried: true }); },
      back: function () { self.setState({ sent: false }); } };
  }
}
</script>
</body>
</html>
