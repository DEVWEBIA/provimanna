<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Barre d'onglets mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Navigation" style="width: 390px; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E3DDD0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 18px; font-family: 'Nunito', sans-serif;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.cur}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: 900;">
<span style="width: 52px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: {{t.bg}};">
<sc-if value="{{t.is.acc}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"></path></svg></sc-if>
<sc-if value="{{t.is.plan}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg></sc-if>
<sc-if value="{{t.is.liste}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg></sc-if>
<sc-if value="{{t.is.rec}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg></sc-if>
<sc-if value="{{t.is.prof}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></sc-if>
</span>
{{t.l}}
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["acc","plan","liste","rec","prof"],"default":"acc"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active || 'acc';
    var T = [['acc', 'Accueil', 'MDashboard.dc.html'], ['plan', 'Plan', 'MPlan.dc.html'], ['liste', 'Liste', 'MListe.dc.html'], ['rec', 'Recettes', 'MRecettes.dc.html'], ['prof', 'Profil', 'MProfil.dc.html']];
    return { tabs: T.map(function (t) {
      var on = t[0] === a, is = {}; is[t[0]] = true;
      return { l: t[1], href: t[2], cur: on ? 'page' : 'false', color: on ? '#4A2545' : '#625A60', bg: on ? '#EFE3EC' : 'transparent', is: { acc: !!is.acc, plan: !!is.plan, liste: !!is.liste, rec: !!is.rec, prof: !!is.prof } };
    }) };
  }
}
</script>
</body>
</html>
