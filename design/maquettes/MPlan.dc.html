<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — plan de la semaine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:'Bricolage Grotesque','Nunito',sans-serif}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F3EC; font-family: 'Nunito', sans-serif; color: #2A1A28;">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; padding: 22px 18px 110px; box-sizing: border-box;">
<header style="display: flex; justify-content: space-between; align-items: flex-end;">
<div><p style="margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #625A60;">16 – 22 NOV. · 4 PERS.</p><h1 class="disp" style="margin: 2px 0 0; font-size: 32px; font-weight: 800; letter-spacing: -1px;">Semaine 47</h1></div>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid #4A2545; background: #FFFFFF; color: #4A2545; font: 900 13px Nunito;">Varier</button>
</header>

<div role="tablist" aria-label="Jours" style="margin: 16px -18px 0; padding: 0 18px; display: flex; gap: 6px; overflow-x: auto;">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button type="button" role="tab" aria-selected="{{d.on}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="display: block; font-size: 11px; font-weight: 900;">{{d.l}}</span><span class="disp" style="display: block; font-size: 20px; font-weight: 800;">{{d.n}}</span></button></sc-for>
</div>

<div style="margin-top: 18px; display: flex; flex-direction: column; gap: 12px;">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="2">
<article style="background: #FFFFFF; border: 1px solid #E3DDD0; border-radius: 24px; overflow: hidden;">
<a href="MRecette.dc.html" style="display: flex; gap: 14px; align-items: center; padding: 14px; text-decoration: none; color: #2A1A28;">
<span style="background: {{m.tint}}; border-radius: 18px; padding: 6px;"><dc-import variant="{{m.v}}" size="84" name="Plat" hint-size="84px,84px"></dc-import></span>
<span style="flex: 1;"><span style="display: block; font-size: 11px; font-weight: 900; letter-spacing: 0.8px; color: #625A60;">{{m.when}}</span><span style="display: block; font-weight: 900; font-size: 17px; line-height: 1.2;">{{m.n}}</span><span class="num" style="display: block; margin-top: 4px; font-size: 13px; font-weight: 800; color: #625A60;">{{m.t}} min · <span style="color: #9A420E;">{{m.p}}</span></span></span>
</a>
<div style="display: flex; border-top: 1px solid #EFEAE0;"><button type="button" onClick="{{m.swap}}" style="flex: 1; min-height: 46px; border: 0; background: transparent; font: 800 14px Nunito; color: #4A2545;">↻ Remplacer</button><span style="width: 1px; background: #EFEAE0;"></span><a href="MRecette.dc.html" style="flex: 1; min-height: 46px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #2A1A28; text-decoration: none;">Voir la recette</a></div>
</article>
</sc-for>
</div>
<p style="margin: 14px 0 0; text-align: center; font-size: 13px; font-weight: 700; color: #625A60;">Glisse un repas vers un autre jour pour l'échanger</p>
</div>

<a href="MComparateur.dc.html" style="position: absolute; left: 12px; right: 12px; bottom: 96px; display: flex; align-items: center; gap: 12px; background: #2A1A28; color: #FFFFFF; border-radius: 20px; padding: 12px 14px; text-decoration: none; box-shadow: 0 10px 30px rgba(42,26,40,0.3);">
<span style="flex: 1;"><span style="display: block; font-size: 11px; font-weight: 900; letter-spacing: 0.8px; color: #D9CCD6;">CHEZ AUCHAN</span><span class="disp num" style="font-size: 24px; font-weight: 800;">{{total}}</span></span>
<span class="num" style="background: #EE7A30; color: #2A1A28; font-weight: 900; font-size: 13px; padding: 6px 10px; border-radius: 12px;">dès {{cheap}} chez Lidl</span>
<span aria-hidden="true" style="font-weight: 900;">›</span>
</a>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="MTabBar" active="plan" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: 3, sw: {} }; }
  renderVals() {
    var self = this, s = this.state;
    var fmt = function (v) { return v.toFixed(2).replace('.', ',') + ' €'; };
    var tint = { soupe: '#FCE3D3', curry: '#EFE3EC', salade: '#E8F0DF', pates: '#F5E9DC', dahl: '#F5E9DC', tarte: '#F5E9DC', riz: '#E8F0DF', poisson: '#E3ECF6', gratin: '#FCE3D3', lasagnes: '#F4E3E6', omelette: '#F6EFC8', soupeverte: '#E8F0DF' };
    var D = [['LUN', 16, ['salade', 'Salade lentilles feta', 15, 1.24], ['dahl', 'Dahl de lentilles', 35, 0.88]], ['MAR', 17, ['pates', 'Pâtes tomate basilic', 20, 0.76], ['soupe', 'Velouté de potimarron', 35, 1.24]], ['MER', 18, ['curry', 'Curry de pois chiches', 30, 0.98], ['gratin', 'Gratin de pâtes', 45, 1.10]], ['JEU', 19, ['salade', 'Salade lentilles', 15, 1.24], ['curry', 'Poulet coco', 40, 1.72]], ['VEN', 20, ['riz', 'Riz sauté aux légumes', 25, 0.95], ['soupeverte', 'Soupe de poireaux', 30, 0.84]], ['SAM', 21, ['omelette', 'Omelette aux herbes', 15, 0.92], ['tarte', 'Tarte aux poireaux', 55, 1.18]], ['DIM', 22, ['poisson', 'Saumon et haricots', 25, 2.15], ['lasagnes', 'Lasagnes végé', 60, 1.36]]];
    var ALT = ['omelette', 'Omelette aux herbes', 15, 0.92];
    var days = D.map(function (d, i) {
      var on = s.d === i, today = i === 3;
      return { l: d[0], n: d[1], on: on ? 'true' : 'false', pick: function () { self.setState({ d: i }); },
        style: 'flex:none;width:52px;min-height:62px;border-radius:16px;cursor:pointer;font-family:Nunito;' + (on ? 'background:#4A2545;color:#FFFFFF;border:0' : 'background:#FFFFFF;color:#2A1A28;border:1px solid ' + (today ? '#4A2545' : '#E3DDD0')) };
    });
    var cur = D[s.d], delta = 0;
    var meals = [cur[2], cur[3]].map(function (m, k) {
      var key = s.d + '-' + k, swapped = !!s.sw[key], r = swapped ? ALT : m;
      if (swapped) delta += (ALT[3] - m[3]) * 4;
      return { when: k === 0 ? 'MIDI' : 'SOIR', v: r[0], n: r[1], t: r[2], p: fmt(r[3]) + ' / part', tint: tint[r[0]],
        swap: function () { var o = Object.assign({}, s.sw); o[key] = !swapped; self.setState({ sw: o }); } };
    });
    Object.keys(s.sw).forEach(function (k) { if (s.sw[k] && k.indexOf(s.d + '-') !== 0) { var p = k.split('-'); delta += (ALT[3] - D[+p[0]][2 + (+p[1])][3]) * 4; } });
    return { days: days, meals: meals, total: fmt(71.6 + delta), cheap: fmt(60.1 + delta * 0.84) };
  }
}
</script>
</body>
</html>
